# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true
palette = 'dvyd'
format = '''$username[@](dimmed bold)$hostname$directory$all'''

# Replace the '❯' symbol in the prompt with '❌'
[character] # The name of the module we are configuring is 'character'
# success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'
error_symbol = "[❌](bold red)" # The 'error_symbol' segment is being set to '❌' with the color 'bold red'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[palettes.dvyd]
mustard = '#af8700'
mint = '#00af66'
git = '#f05133'
nodejs = '#5fa04e'
lua = '#00007f'

[username]
format = "[$user]($style)"
show_always = true
disabled = false
style_user = "mustard dimmed bold"
style_root = "red dimmed bold"

[hostname]
format = "[$hostname]($style) "
ssh_only = false
ssh_symbol = "🌐 "
disabled = false
style = "mint dimmed bold"

[directory]
truncate_to_repo = false
use_os_path_sep = true
use_logical_path = true
style = "purple bold"
home_symbol = "~"
truncation_length = 0
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format='[$symbol\($branch(:$remote_branch)\)]($style) '
# format = "on [$symbol$branch]($style):[$remote_branch]($style dimmed) "
# symbol = '🌱 '
symbol = ""
always_show_remote = true
style = "bold git"
truncation_length = 4
truncation_symbol = ''
# ignore_branches = ['master', 'main']

[git_commit]
commit_hash_length = 4
# tag_symbol = '🔖 '
tag_symbol = " 🏷  "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = '[🍒 PICKING](bold red)'

[nodejs]
format = '[{](dimmed bold) [nodejs]($style)[@](dimmed bold)[$version]($style) [}](dimmed bold) '
version_format = "${raw}"
symbol = ' '
style = "bold nodejs"

[lua]
format = '[{](dimmed bold) [lua]($style)[@](dimmed bold)[$version]($style) [}](dimmed bold) '
version_format = "${raw}"
symbol = "🌙 "
style = "bold lua"